services:
  vector1090:
    build: .
    image: vector1090
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      ADSB_API_KEY: ${ADSB_API_KEY:-}
      ADSB_API_BASE: ${ADSB_API_BASE:-https://api.adsb.lol}
      PHOTO_USER_AGENT: "${PHOTO_USER_AGENT:-vector1090/1.0 (+https://github.com/Reforge-OSS/vector1090)}"
      FEED_MODE: ${FEED_MODE:-public}
      LOCAL_AIRCRAFT_URL: ${LOCAL_AIRCRAFT_URL:-http://localhost:8080/data/aircraft.json}
      ALLOW_CLIENT_LOCAL_URL: ${ALLOW_CLIENT_LOCAL_URL:-true}
      HOME_LAT: ${HOME_LAT:-52.8311}
      HOME_LON: ${HOME_LON:--1.3281}
      HOME_RADIUS_NM: ${HOME_RADIUS_NM:-50}
    # For a receiver on the Docker host, use host.docker.internal in LOCAL_AIRCRAFT_URL:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
